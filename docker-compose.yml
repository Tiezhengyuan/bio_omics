services:

  mysql:
    image: mysql:8.4
    container_name: bomics-db

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    
    ports:
      - "${MYSQL_PORT}:3306"
    
    expose:
      - 3306
    
    volumes:
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
    
    restart: always